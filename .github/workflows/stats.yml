name: Refresh profile card

on:
  schedule:
    - cron: "17 4 * * *"     # daily, a few minutes off the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.py", "stats.py", "portrait.txt"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ACCESS_TOKEN is a fine-grained PAT scoped to all repositories with
      # `Metadata: Read-only` — the entire permission the stats endpoints need,
      # and no write access anywhere. It is required, not optional: the default
      # GITHUB_TOKEN is an app installation token whose GraphQL `viewer` is not
      # a User, so the query errors out rather than degrading to public-only.
      - name: Refresh stats
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python stats.py

      - name: Rebuild SVGs
        run: python build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.json dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile card"
          git push
